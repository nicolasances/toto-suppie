name: Dev Release

on:
  push:
    branches:
      - 'feature/**'
      - 'issue/**'
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  release-dev:
    name: Build & Deploy to Cloud Run and GKE
    environment: dev
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

    - name: Setup GCloud
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ secrets.GCP_PID }}
        install_components: gke-gcloud-auth-plugin

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev

    - name: Create Environment Variables
      run: |
        PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        PACKAGE_NAME=$(cat package.json | grep name | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

    - name: Compute image tag (<version>-<short sha>)
      run: |
        IMAGE_TAG=${PACKAGE_VERSION}-${GITHUB_SHA::7}
        IMAGE=europe-west1-docker.pkg.dev/${{ secrets.GCP_PID }}/${PACKAGE_NAME}/${PACKAGE_NAME}:${IMAGE_TAG}
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

    - name: Check whether the image already exists
      run: |
        # Re-running the job for the same commit: skip build and push, just redeploy.
        if OUT=$(gcloud artifacts docker images describe "$IMAGE" 2>&1); then
          echo "Image $IMAGE already exists, skipping build and push."
          echo "IMAGE_EXISTS=true" >> $GITHUB_ENV
        elif echo "$OUT" | grep -qiE "not found|NOT_FOUND"; then
          echo "IMAGE_EXISTS=false" >> $GITHUB_ENV
        else
          echo "::error::Could not check the image in Artifact Registry: $OUT"
          exit 1
        fi

    - name: Build Docker image
      if: env.IMAGE_EXISTS != 'true'
      run: |
        docker build \
        --build-arg AUTH_API_ENDPOINT=${{ secrets.AUTH_API_ENDPOINT }} \
        --build-arg SUPERMARKET_API_ENDPOINT=${{ secrets.SUPERMARKET_API_ENDPOINT }} \
        --build-arg GALE_BROKER_API_ENDPOINT=${{ secrets.GALE_BROKER_API_ENDPOINT }} \
        --build-arg WHISPERING_API_ENDPOINT=${{ secrets.WHISPERING_API_ENDPOINT }} \
        --build-arg GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
        . -t $IMAGE

    - name: Push Docker image to Artifact Registry
      if: env.IMAGE_EXISTS != 'true'
      run: docker push $IMAGE

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.PACKAGE_NAME }} --project=${{ secrets.GCP_PID }} --service-account=${{ secrets.SERVICE_ACCOUNT }} --image=$IMAGE --platform=managed --region=europe-west1 --allow-unauthenticated

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        project_id: ${{ vars.GKE_PROJECT_ID }}
        cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
        location: ${{ vars.GKE_CLUSTER_LOCATION }}

    - name: Deploy to GKE
      run: |
        kubectl -n ${{ vars.GKE_NAMESPACE }} set image deployment/toto-react-supermarket toto-react-supermarket=$IMAGE
        kubectl -n ${{ vars.GKE_NAMESPACE }} rollout status deployment/toto-react-supermarket --timeout=5m
